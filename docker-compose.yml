name: meble

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: meble
      POSTGRES_PASSWORD: meble
      POSTGRES_DB: meble
    ports:
      - "5432:5432"
    volumes:
      - meble_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meble -d meble"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    image: meble-server:local
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://meble:meble@postgres:5432/meble
      MEBLE_BASE_URL: https://www.meble.pl
      SYNC_INTERVAL_MS: "10800000"
      PORT: "3000"
      TYPEORM_SYNCHRONIZE: "true"
    ports:
      - "3010:3000"
    restart: unless-stopped
    command: ["node", "packages/api/dist/main.js"]
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health').then((response)=>process.exit(response.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 36
      start_period: 600s

  magazyn:
    image: meble-server:local
    depends_on:
      api:
        condition: service_healthy
    environment:
      API_BASE_URL: http://api:3000
      PORT: "3000"
    ports:
      - "3011:3000"
    restart: unless-stopped
    command: ["node", "packages/magazyn/serve.mjs"]
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health').then((response)=>process.exit(response.ok && (response.headers.get('content-type')||'').includes('text/html')?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

volumes:
  meble_pg:
